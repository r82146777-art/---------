<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم ابری هرمس | آپدیت جدید</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1a1a1a;
            --chat-bg: #1e1e1e;
            --user-msg: #2b5278;
            --bot-msg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #0088cc;
            --btn-gray: #444;
            --skill-bg: #222222;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* منوی کناری - چت‌های اخیر */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }
        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .new-chat-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            font-weight: bold;
        }
        .new-chat-btn:hover { background-color: #006699; }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chat-item {
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }
        .chat-item:hover { background-color: #333; }
        .chat-item.active {
            border-color: var(--accent-color);
            background-color: #253340;
        }
        
        /* بخش اصلی چت */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: var(--chat-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .controls { display: flex; gap: 10px; }
        .settings-btn, .model-select {
            background-color: var(--chat-bg);
            border: 1px solid #555;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .settings-btn:hover, .model-select:hover {
            background-color: #333;
            border-color: var(--accent-color);
        }
        .skill-store {
            background-color: var(--skill-bg);
            padding: 10px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid #444;
            white-space: nowrap;
        }
        .skill-btn {
            background-color: #333;
            color: #ddd;
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .skill-btn:hover, .skill-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .skill-btn.download-btn {
            background-color: #9c27b0;
            border-color: #7b1fa2;
            font-weight: bold;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-wrapper { max-width: 85%; display: flex; flex-direction: column; gap: 5px; }
        .user-wrapper { align-self: flex-start; }
        .bot-wrapper { align-self: flex-end; }
        .message { padding: 12px 16px; border-radius: 12px; line-height: 1.6; word-wrap: break-word; }
        .user-message { background-color: var(--user-msg); border-bottom-right-radius: 2px; }
        .bot-message { background-color: var(--bot-msg); border-bottom-left-radius: 2px; border: 1px solid #444; }
        .action-buttons { display: flex; gap: 8px; justify-content: flex-end; }
        .action-btn { background-color: var(--btn-gray); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .action-btn:hover { background-color: #555; }
        .input-area {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--bg-color);
            color: white;
            outline: none;
            direction: rtl;
        }
        input[type="text"]:focus { border-color: var(--accent-color); }
        .main-btn { background-color: var(--accent-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .loading { font-size: 0.9rem; color: #aaa; align-self: flex-end; display: none; margin-top: -5px; }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- نوار کناری: حافظه چت‌ها -->
    <div class="sidebar">
        <div class="sidebar-header">
            چت‌های اخیر
        </div>
        <div style="padding: 0 10px;">
            <button class="new-chat-btn" onclick="createNewChat()">+ چت جدید</button>
        </div>
        <div class="chat-list" id="chat-list">
            <!-- لیست چت‌ها اینجا لود می‌شود -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div style="font-weight: bold; font-size: 1.2rem;">🚀 پلتفرم ابری هرمس</div>
            <div class="controls">
                <!-- آپدیت مدل‌ها دقیقاً مطابق با درخواست شما -->
                <select id="model-select" class="model-select">
                    <option value="gemini-3.5-flash">⚡ مدل 3.5 Flash</option>
                    <option value="gemini-3.8-flash">🚀 مدل 3.8 Flash (جدید)</option>
                    <option value="gemini-3.1-pro">🧠 مدل 3.1 Pro (پیشرفته)</option>
                </select>
                <button class="settings-btn" onclick="askForKeys(true)">🔑 کلیدها</button>
            </div>
        </div>

        <!-- فروشگاه مهارت‌ها -->
        <div class="skill-store" id="skill-store">
            <button class="skill-btn download-btn" onclick="downloadCustomSkill()">🔍 دانلود مهارت جدید...</button>
            <button class="skill-btn active" onclick="loadSkill('عمومی', this)">🧠 هرمس عمومی</button>
            <button class="skill-btn" onclick="loadSkill('گیت‌هاب', this)">⚙️ معمار گیت‌هاب</button>
            <button class="skill-btn" onclick="loadSkill('روبیکا و تلگرام', this)">🤖 مدیر بات</button>
        </div>

        <div class="chat-container" id="chat-box">
            <!-- پیام‌ها اینجا لود می‌شوند -->
        </div>
        
        <div class="loading" id="loading-indicator">در حال پردازش... ⏳</div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="درخواست خود را وارد کنید..." onkeypress="handleKeyPress(event)">
            <button class="main-btn" onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script>
        let GEMINI_API_KEY = localStorage.getItem("hermes_api_key");
        
        let chatSessions = JSON.parse(localStorage.getItem("hermes_sessions")) || [];
        let currentSessionId = localStorage.getItem("hermes_current_session") || null;
        
        let systemInstruction = "شما هرمس هستید، یک هوش مصنوعی بسیار هوشمند که به زبان فارسی پاسخ می‌دهد.";

        const chatBox = document.getElementById("chat-box");
        const chatList = document.getElementById("chat-list");
        const userInput = document.getElementById("user-input");
        const loadingIndicator = document.getElementById("loading-indicator");
        const modelSelect = document.getElementById("model-select");

        window.onload = () => {
            if (!GEMINI_API_KEY) askForKeys(false);
            if (chatSessions.length === 0) createNewChat();
            else loadChatSession(currentSessionId || chatSessions[0].id);
            renderChatList();
        };

        function askForKeys(force = false) {
            if (!GEMINI_API_KEY || force) {
                let geminiKey = prompt("لطفاً کلید API جمنای خود را وارد کنید:", GEMINI_API_KEY || "");
                if (geminiKey && geminiKey.trim() !== "") {
                    GEMINI_API_KEY = geminiKey.trim();
                    localStorage.setItem("hermes_api_key", GEMINI_API_KEY);
                }
            }
        }

        function createNewChat() {
            const newId = Date.now().toString();
            const newSession = {
                id: newId,
                title: "چت جدید",
                history: [],
                skill: systemInstruction
            };
            chatSessions.unshift(newSession); 
            saveSessions();
            loadChatSession(newId);
            renderChatList();
        }

        function loadChatSession(id) {
            currentSessionId = id;
            localStorage.setItem("hermes_current_session", id);
            const session = chatSessions.find(s => s.id === id);
            systemInstruction = session.skill;
            
            chatBox.innerHTML = ""; 
            if (session.history.length === 0) {
                appendMessageToUI("bot", "سلام! من هرمس هستم. حافظه و مدل‌های آپدیت‌شده (۳.۵، ۳.۸ و ۳.۱ پرو) آماده کار هستند. چه کاری برایت انجام دهم؟", false);
            } else {
                session.history.forEach(msg => {
                    const sender = msg.role === "user" ? "user" : "bot";
                    appendMessageToUI(sender, msg.parts[0].text, false);
                });
            }
            renderChatList();
        }

        function saveSessions() {
            localStorage.setItem("hermes_sessions", JSON.stringify(chatSessions));
        }

        function renderChatList() {
            chatList.innerHTML = "";
            chatSessions.forEach(session => {
                const div = document.createElement("div");
                div.classList.add("chat-item");
                if (session.id === currentSessionId) div.classList.add("active");
                div.innerText = session.title;
                div.onclick = () => loadChatSession(session.id);
                chatList.appendChild(div);
            });
        }

        function loadSkill(skillName, btnElement) {
            document.querySelectorAll('.skill-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            if(skillName === 'گیت‌هاب') {
                systemInstruction = "شما هرمس هستید. مهارت: معمار ارشد گیت‌هاب. تخصص در کدهای پایتون، GitHub Actions و بیلد اپلیکیشن.";
            } else if(skillName === 'روبیکا و تلگرام') {
                systemInstruction = "شما هرمس هستید. مهارت: مدیر بات‌ها. متخصص ساخت و اتصال API برای تلگرام و روبیکا.";
            } else if(skillName === 'عمومی') {
                systemInstruction = "شما هرمس هستید، یک هوش مصنوعی بسیار هوشمند که به زبان فارسی پاسخ می‌دهد.";
            }

            const session = chatSessions.find(s => s.id === currentSessionId);
            session.skill = systemInstruction;
            saveSessions();
            
            appendMessageToUI("bot", `✅ مهارت [${skillName}] روی هرمس نصب شد.`, false);
        }

        function downloadCustomSkill() {
            const requestedSkill = prompt("به چه مهارتی نیاز دارید؟ (مثلاً بنویسید: 'برنامه‌نویس جاوا اسکریپت' یا 'آهنگساز')");
            if (!requestedSkill || requestedSkill.trim() === "") return;
            
            alert(`در حال اتصال به سرور و دانلود مهارت "${requestedSkill}"...`);
            
            systemInstruction = `شما هرمس هستید. مهارت جدید شما: ${requestedSkill}. شما یک متخصص حرفه‌ای و بی‌نقص در این زمینه هستید و تمام پاسخ‌هایتان بر اساس این تخصص است.`;
            
            const session = chatSessions.find(s => s.id === currentSessionId);
            session.skill = systemInstruction;
            saveSessions();

            const store = document.getElementById("skill-store");
            const newBtn = document.createElement("button");
            newBtn.classList.add("skill-btn", "active");
            newBtn.innerText = `📦 ${requestedSkill}`;
            store.appendChild(newBtn);

            appendMessageToUI("bot", `✅ مهارت [${requestedSkill}] با موفقیت از پایگاه داده ابری دریافت و نصب شد.`, false);
        }

        function handleKeyPress(event) { if (event.key === "Enter") sendMessage(); }
        function copyText(text) { navigator.clipboard.writeText(text).then(() => alert("کپی شد!")); }

        function appendMessageToUI(sender, text, isNew = true) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");

            if (sender === "user") {
                wrapper.classList.add("user-wrapper");
                msgDiv.classList.add("user-message");
                msgDiv.innerText = text;
                wrapper.appendChild(msgDiv);
            } else {
                wrapper.classList.add("bot-wrapper");
                msgDiv.classList.add("bot-message");
                msgDiv.innerText = text;
                wrapper.appendChild(msgDiv);

                const actionsDiv = document.createElement("div");
                actionsDiv.classList.add("action-buttons");

                const copyBtn = document.createElement("button");
                copyBtn.classList.add("action-btn");
                copyBtn.innerText = "📋 کپی";
                copyBtn.onclick = () => copyText(text);

                actionsDiv.appendChild(copyBtn);
                wrapper.appendChild(actionsDiv);
            }
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            if (!GEMINI_API_KEY) { askForKeys(); return; }

            const text = userInput.value.trim();
            if (!text) return;

            appendMessageToUI("user", text);
            userInput.value = "";
            loadingIndicator.style.display = "block";

            const session = chatSessions.find(s => s.id === currentSessionId);
            
            if (session.history.length === 0) {
                session.title = text.substring(0, 20) + (text.length > 20 ? "..." : "");
                renderChatList();
            }

            const currentUserMsg = {"role": "user", "parts": [{"text": text}]};
            session.history.push(currentUserMsg);
            saveSessions();

            const selectedModel = modelSelect.value;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        "system_instruction": {
                            "parts": [{"text": systemInstruction}]
                        },
                        "contents": session.history
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    appendMessageToUI("bot", botReply);
                    
                    session.history.push({"role": "model", "parts": [{"text": botReply}]});
                    saveSessions();
                } else if (data.error) {
                    if (data.error.message.includes("high demand")) {
                        appendMessageToUI("bot", "⚠️ سرور گوگل شلوغ است. سیستم Auto-Retry در حال تلاش مجدد... لطفاً چند ثانیه دیگر دوباره امتحان کنید.");
                        session.history.pop();
                    } else {
                        appendMessageToUI("bot", `⚠️ خطا: ${data.error.message}`);
                        session.history.pop();
                    }
                }
            } catch (error) {
                appendMessageToUI("bot", "⚠️ خطای اینترنت! (فیلترشکن را بررسی کنید).");
                session.history.pop();
            } finally {
                loadingIndicator.style.display = "none";
            }
        }
    </script>
</body>
</html>
